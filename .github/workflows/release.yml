name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        shell: bash
        run: |
          cd Client/backend/ultron_backend || cd client/backend/ultron_backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Create Config File from Template
        shell: bash
        run: |
          cd Client/backend/ultron_backend || cd client/backend/ultron_backend
          python -c "import secrets; open('secret.key','w').write(secrets.token_urlsafe(64))"
          cp .env.template .env
          python run.py --encrypt-env

      - name: Build UltrON.exe
        shell: bash
        run: |
          cd Client/backend/ultron_backend || cd client/backend/ultron_backend
          python -m PyInstaller UltrON.spec --noconfirm

      - name: Build UltrON_Installer.exe
        shell: bash
        run: |
          cd Client/backend/ultron_backend || cd client/backend/ultron_backend
          python -m PyInstaller ../../installer.py --onefile --console --icon=ultron.ico --name=UltrON_Installer --noconfirm

      - name: Upload Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Client/backend/ultron_backend/dist/UltrON.exe
            Client/backend/ultron_backend/dist/UltrON_Installer.exe
          fail_on_unmatched_files: false
          generate_release_notes: true
